name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test:unit --run
      - run: pnpm exec playwright install --with-deps chromium
      # E2E はローカル D1(認証不要)に対して webServer がマイグレーション込みで起動する
      - run: pnpm exec playwright test
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 787ced2ddcca3b5d90c05945c3b7fe3c
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # マイグレーション適用 → デプロイの順を固定し、新コードが旧スキーマを踏まないようにする
      # cf の D1 コマンドはデータベース名ではなく ID を取る。--local を付けなければ本番に適用される
      - run: pnpm cf d1 migrations apply f3c0e812-aaa5-4575-a6ab-df63dce70350
      # cf build は SvelteKit を検出すると vite build だけを実行し、cf deploy が読む
      # .cloudflare/output を作らない。Wrangler に書き出させてから --prebuilt で送る
      - run: pnpm build && pnpm build:cf
      - run: pnpm cf deploy --prebuilt
      - run: pnpm install --frozen-lockfile
        working-directory: workers/cleanup
      - run: pnpm wrangler build --x-new-config --x-cf-build-output && pnpm cf deploy --prebuilt
        working-directory: workers/cleanup
